name: Catalogo Vidri y Freund

on:
  schedule:
    # Cada 6 horas. Usa siempre el identificador semanal automatico (produccion).
    - cron: '0 0,6,12,18 * * *'  # Explícitamente 0, 6, 12, 18 UTC
  workflow_dispatch:
    inputs:
      run_id_override:
        description: 'Identificador de corrida para PRUEBAS (vacio = usa el semanal de produccion, NO lo cambies para corridas reales)'
        required: false
        default: ''
      inicio:
        description: 'Primera categoria (prueba). Vacio = 1'
        required: false
        default: ''
      fin:
        description: 'Ultima categoria (prueba). Vacio = todas'
        required: false
        default: ''
      proveedor:
        description: 'ambos, vidri o freund'
        required: false
        default: 'ambos'
      max_paginas:
        description: 'Limite de paginas por categoria (vacio = 100)'
        required: false
        default: '100'
      reabrir:
        description: 'Recapturar categorias ya terminadas de la campana actual: proveedor=fragmento separados por coma (ej. freund=/TORNILLOS/productos/NVL3-35). Vacio = no reabrir nada'
        required: false
        default: ''

# El flujo solo lee el codigo; cache y artefactos usan su propio token de ejecucion.
permissions:
  contents: read

concurrency:
  group: catalogo-scraper
  cancel-in-progress: false

jobs:
  scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular identificador de campana (semana ISO, hora El Salvador)
        id: campana
        env:
          OVERRIDE: ${{ github.event.inputs.run_id_override }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            if ! [[ "$OVERRIDE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$ ]]; then
              echo "ERROR: run_id_override solo admite letras, numeros, guiones y guiones bajos (maximo 80)."
              exit 1
            fi
            echo "id=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "id=catalogo-$(TZ='America/El_Salvador' date +%G-W%V)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restaurar estado previo (si existe)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: catalogo-datos-${{ steps.campana.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            catalogo-datos-${{ steps.campana.outputs.id }}-

      - name: Verificar si hay estado para reanudar
        id: estado
        env:
          CAMPANA: ${{ steps.campana.outputs.id }}
        run: |
          if [ -d "datos/$CAMPANA" ]; then
            echo "reanudar=--reanudar" >> "$GITHUB_OUTPUT"
          else
            echo "reanudar=" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar certificado de Supabase
        env:
          SUPABASE_CA_CERT_B64: ${{ secrets.SUPABASE_CA_CERT_B64 }}
        run: |
          mkdir -p certs
          echo "$SUPABASE_CA_CERT_B64" | base64 -d > certs/prod-ca.crt

      - name: Ejecutar scraping + importacion
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SSLMODE: verify-full
          SUPABASE_SSLROOTCERT: ${{ github.workspace }}/certs/prod-ca.crt
          CAMPANA: ${{ steps.campana.outputs.id }}
          REANUDAR: ${{ steps.estado.outputs.reanudar }}
          INICIO: ${{ github.event.inputs.inicio }}
          FIN: ${{ github.event.inputs.fin }}
          PROVEEDOR: ${{ github.event.inputs.proveedor }}
          MAXPAGINAS: ${{ github.event.inputs.max_paginas }}
          REABRIR: ${{ github.event.inputs.reabrir }}
        run: |
          for VALOR in "$INICIO" "$FIN" "$MAXPAGINAS"; do
            if [ -n "$VALOR" ] && ! [[ "$VALOR" =~ ^[0-9]+$ ]]; then
              echo "ERROR: inicio, fin y max_paginas deben ser numeros enteros."
              exit 1
            fi
          done
          if ! [[ "$REABRIR" =~ ^[A-Za-z0-9_./=,-]*$ ]]; then
            echo "ERROR: reabrir solo admite letras, numeros y los simbolos _ . / = , -"
            exit 1
          fi
          case "$PROVEEDOR" in
            ""|ambos|vidri|freund) ;;
            *) echo "ERROR: proveedor debe ser ambos, vidri o freund."; exit 1 ;;
          esac
          MAXPAGINAS="${MAXPAGINAS:-100}"
          ARGS="--run-id $CAMPANA --guardar $REANUDAR"
          if [ -n "$INICIO" ]; then ARGS="$ARGS --inicio $INICIO"; fi
          if [ -n "$FIN" ]; then ARGS="$ARGS --fin $FIN"; fi
          if [ -n "$PROVEEDOR" ]; then ARGS="$ARGS --proveedor $PROVEEDOR"; fi
          if [ -n "$MAXPAGINAS" ]; then ARGS="$ARGS --max-paginas $MAXPAGINAS"; fi
          echo "Ejecutando: python -u ejecutar_nube.py $ARGS ${REABRIR:+--reabrir $REABRIR}"

          set +e
          python -u ejecutar_nube.py $ARGS ${REABRIR:+--reabrir "$REABRIR"}
          CODIGO=$?
          set -e

          echo "Codigo de salida de ejecutar_nube.py: $CODIGO"

          if [ "$CODIGO" -eq 0 ]; then
            echo "Catalogo completo importado correctamente."
          elif [ "$CODIGO" -eq 2 ]; then
            echo "AVISO: corrida parcial (catalogo aun no termina). Se reanudara automaticamente en el siguiente disparo programado. Esto NO es un error."
          else
            echo "ERROR real: codigo de salida $CODIGO. Revisa los logs subidos como artefacto."
            exit $CODIGO
          fi

      - name: Guardar estado para la proxima corrida
        if: always()
        uses: actions/cache/save@v4
        with:
          path: datos
          key: catalogo-datos-${{ steps.campana.outputs.id }}-${{ github.run_id }}

      - name: Subir logs y resumenes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.campana.outputs.id }}-${{ github.run_id }}
          path: |
            datos/${{ steps.campana.outputs.id }}/**/*.log
            datos/${{ steps.campana.outputs.id }}/**/resumen.json
            datos/${{ steps.campana.outputs.id }}/pipeline.json
            datos/${{ steps.campana.outputs.id }}/**/registros_por_revisar.csv
          retention-days: 30
          if-no-files-found: ignore
